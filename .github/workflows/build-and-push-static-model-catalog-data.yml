name: Build and Validate Model Catalog Data Image

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'input/**'
      - 'release/**'
      - 'cmd/release-candidate/**'
      - 'cmd/serving-runtime-catalog/**'
      - 'internal/servingruntime/**'
      - 'pkg/types/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/releasecandidate/**'
      - 'Dockerfile'
      - 'Dockerfile.fixture'
      - 'scripts/prepare-image.sh'
      - 'scripts/check-runtime-catalogs.sh'
      - 'scripts/test-prepare-image.sh'
      - 'Dockerfile.konflux'
      - '.dockerignore'
      - 'Makefile'
      - '.github/workflows/build-and-push-static-model-catalog-data.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'data/**'
      - 'input/**'
      - 'release/**'
      - 'cmd/release-candidate/**'
      - 'cmd/serving-runtime-catalog/**'
      - 'internal/servingruntime/**'
      - 'pkg/types/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/releasecandidate/**'
      - 'Dockerfile'
      - 'Dockerfile.fixture'
      - 'scripts/prepare-image.sh'
      - 'scripts/check-runtime-catalogs.sh'
      - 'scripts/test-prepare-image.sh'
      - 'Dockerfile.konflux'
      - '.dockerignore'
      - 'Makefile'
      - '.github/workflows/build-and-push-static-model-catalog-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Fixture image smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Test and stage the release-candidate fixture
        run: |
          make test
          make test-image-preparation
          make validate-release-candidate-fixture

      # This proves payload validation, exact loader-matrix membership, and the
      # unified layout without publishing fixture data. Product builds use
      # Dockerfile with private Git access and approved loader-check secrets.
      # The public, digest-pinned UBI override lets fork CI build without
      # registry.redhat.io credentials; product builds retain Dockerfile's
      # separately pinned default base.
      - name: Build unified data image fixture
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile.fixture
          build-args: |
            BASE_IMAGE=registry.access.redhat.com/ubi9/ubi-minimal@sha256:a21d19f72557aa893a0f6ca1177bb1ffd91df6015e60470a116c50a6a05efcd9
            RELEASE_CANDIDATE_DIR=build/release-candidate-fixture
          load: true
          push: false
          tags: unified-model-catalog-data:fixture
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Verify payload as an arbitrary non-root user
        run: |
          docker run --rm --user 1001230000 --entrypoint /bin/sh unified-model-catalog-data:fixture -c '
            test -r /app/data/models-catalog.yaml &&
            test -r /app/data/validated-models-catalog.yaml &&
            test -s /app/data/redhat-serving-runtimes-catalog.yaml &&
            test -r /app/data/redhat-serving-runtimes-catalog.yaml &&
            test ! -e /app/data/redhat-serving-runtimes-index.yaml &&
            test ! -e /app/data/validated-models-index.yaml &&
            test -r /app/benchmarks/manifest.json &&
            test -r /app/benchmarks/RedHatAI/Apertus-8B-Instruct-2509-FP8-dynamic/metadata.json
          '

  release-validation:
    name: Release validation (advisory)
    runs-on: ubuntu-latest
    # Keep failures visible without making release validation a merge gate yet.
    continue-on-error: true
    timeout-minutes: 30
    env:
      CATALOG_DATA_REPOSITORY: ${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
      CATALOG_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      BENCHMARK_REVISION: ${{ vars.BENCHMARK_REVISION }}
      VALIDATION_BUILDER_IMAGE: ${{ vars.RELEASE_VALIDATION_BUILDER_IMAGE }}

    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Validate release inputs and build
        id: validation
        env:
          GITHUB_TOKEN: ${{ secrets.BENCHMARK_GITHUB_TOKEN }}
          LOADER_RHOAI_3_6: ${{ secrets.RHOAI_3_6_LOADER_CHECK }}
        run: |
          missing=()
          [ -n "$GITHUB_TOKEN" ] || missing+=(BENCHMARK_GITHUB_TOKEN)
          [ -n "$LOADER_RHOAI_3_6" ] || missing+=(RHOAI_3_6_LOADER_CHECK)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Release validation inputs unavailable: ${missing[*]}"
            printf 'Missing secrets: `%s`. Validation did not run.\n' "${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          umask 077
          loader_dir="$RUNNER_TEMP/model-catalog-loader-checks"
          mkdir -p "$loader_dir"
          printf '%s\n' "$LOADER_RHOAI_3_6" > "$loader_dir/rhoai-3.6"
          chmod 700 "$loader_dir/rhoai-3.6"

          make docker-build \
            CONTAINER_RUNTIME=docker \
            VALIDATE_RELEASE=true \
            MODEL_CATALOG_LOADER_CHECK_DIR="$loader_dir" \
            BUILDER_IMAGE="$VALIDATION_BUILDER_IMAGE" \
            BASE_IMAGE=registry.access.redhat.com/ubi9/ubi-minimal@sha256:a21d19f72557aa893a0f6ca1177bb1ffd91df6015e60470a116c50a6a05efcd9 \
            DOCKER_IMAGE_NAME=localhost/ai-hub-catalog \
            DOCKER_IMAGE_TAG=release-validation

      - name: Record advisory validation result
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          printf '\n### Release validation (advisory)\n\nResult: **%s**. This job is non-blocking; no image is published.\n' \
            "$VALIDATION_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
